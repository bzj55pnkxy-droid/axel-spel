<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dubbelgångare</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Title / Start Screen -->
  <div id="blocker">
    <div id="title-screen">
      <h1>DUBBELGÅNGARE</h1>
      <p class="tagline">You are not alone.</p>
      <p class="start-prompt">Click to begin</p>
      <p class="controls-hint">WASD - Move &nbsp; Mouse - Look &nbsp; E - Interact &nbsp; ESC - Pause</p>
    </div>
  </div>

  <!-- Intro / Narrative overlay -->
  <div id="narrative-overlay" class="hidden">
    <p id="narrative-text"></p>
  </div>

  <!-- Crosshair -->
  <div id="crosshair" class="hidden"></div>

  <!-- Interaction prompt -->
  <div id="interact-prompt" class="hidden"></div>

  <!-- Puzzle hint -->
  <div id="puzzle-hint" class="hidden"></div>

  <!-- Game Over / End Screen -->
  <div id="game-over" class="hidden">
    <div id="end-content">
      <h1>DU ÄR INTE ENSAM</h1>
      <p>You are not alone.</p>
      <div id="credits">
        <p class="credit-title">DUBBELGÅNGARE</p>
        <p class="credit-sub">A PS1 Horror Experience</p>
        <div class="credit-line"></div>
        <p>Design &amp; Code — OWL</p>
        <p>Engine — Three.js</p>
        <p>Audio — Web Audio API</p>
        <div class="credit-line"></div>
        <p class="restart-prompt">Click to restart</p>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
